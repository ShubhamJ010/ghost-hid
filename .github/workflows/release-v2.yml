name: Release build (v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. Release build skipped."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "release.jks decoded ($(stat -c%s release.jks) bytes)"

      - name: Write keystore.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties
          echo "keystore.properties written"
          cat keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Capture Gradle and Java versions
        run: |
          echo "java: $(java -version 2>&1 | head -1)"
          echo "gradle: $(./gradlew --version | head -3)"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --info

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          echo "APK=$APK"
          ls -la "$APK" || true
          echo "=== output-metadata.json ==="
          find . -path "*/build/outputs/apk/release/output-metadata.json" -exec cat {} \; || true
          echo "=== Signature verification ==="
          BT=$(ls "$ANDROID_HOME/build-tools" | tail -1)
          echo "build-tools=$BT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: Rename APK with version
        id: version
        run: |
          set -euo pipefail
          META=app/build/outputs/apk/release/output-metadata.json
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionName'])")
          VERSION_CODE=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionCode'])")
          APK=app/build/outputs/apk/release/app-release.apk
          NEW_NAME="ghost-hid-${VERSION_NAME}-v${VERSION_CODE}.apk"
          cp "$APK" "$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Built $NEW_NAME (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"



      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: GhostHID ${{ steps.version.outputs.version_name }}
          files: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug APK as fallback (unsigned)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-hid-release-fallback
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

  publish-changelog:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update changelog unreleased section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f ./scripts/update-changelog.sh ]; then
            echo "::notice::scripts/update-changelog.sh not present; skipping changelog bump"
            exit 0
          fi
          git fetch origin main
          git checkout -B main origin/main
          chmod +x ./scripts/update-changelog.sh
          ./scripts/update-changelog.sh "${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore: mark ${{ github.ref_name }} as released in CHANGELOG.md"
            git push origin main
          fi
