name: Release Build

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. Release build skipped."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "release.jks decoded ($(stat -c%s release.jks) bytes)"

      - name: Decode keystore credentials
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "release.jks_password=${RELEASE_KEYSTORE_PASSWORD}" >> gradle.properties
          echo "release_key_alias=${RELEASE_KEY_ALIAS}" >> gradle.properties
          echo "release_key_password=${RELEASE_KEY_PASSWORD}" >> gradle.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          APK="$(ls app-release.apk)"
          TAG="${{ github.ref_name }}"
          mv "$APK" "ghost-hid-v${TAG#v}.apk"

      - name: Determine versioning from source
        id: version
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -n1 | tr -d '"' | sed 's/.*versionName = *"\([^"]*\)".*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -n1 | sed 's/.*versionCode = *\([0-9]*\).*/\1/')
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="${{ github.ref_name }}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Read changelog
        id: changelog
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_TAG="${TAG#v}"
          python3 - "$RELEASE_TAG" <<'PY'
          import sys, re
          tag = sys.argv[1]
          text = open("CHANGELOG.md", "r", encoding="utf-8").read()
          target = f"## [{tag}]"
          pat = re.compile(rf"^{re.escape(target)}.*$", re.MULTILINE)
          m = pat.search(text)
          if not m:
            print("::warning::release section '[{tag}]' not found in CHANGELOG.md", file=sys.stderr)
            print("full_changelog<<'CHANGELOG_EOF'\n(No matching [X.Y.Z] section found in CHANGELOG.md. Full changelog attached.)\nCHANGELOG_EOF")
            sys.exit(0)
          start = m.end(0)
          next_section = re.search(r"\n## \[", text, m.end(0))
          end = next_section.start(0) if next_section else len(text)
          section = text[m.start(0) : end].rstrip() + "\n"
          print("release_body<<'RELEASE_BODY_EOF'\n" + section + "\nRELEASE_BODY_EOF")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-hid-release
          path: app/build/outputs/apk/release/ghost-hid-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/ghost-hid-*.apk
          title: GhostHID ${{ steps.version.outputs.version_name }}
          body: ${{ steps.changelog.outputs.release_body }}
          tag_name: ${{ steps.version.outputs.release_tag }}
          draft: false
          prerelease: false
